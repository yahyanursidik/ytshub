<!--
  Favicon: lambang Yayasan Tarbiyah Sunnah.

  Bentuknya sama dengan src/components/ui/Logo.astro, tetapi dengan dua
  penyesuaian yang khusus untuk ukuran sangat kecil:

  1. Ujung tiap bidang dipotong sedikit. Lambang aslinya menyempit sampai satu
     titik; pada 16px titik itu hilang dan yang tersisa terlihat seperti tepi
     yang kotor.
  2. Celah antarbidang dilebarkan. Pada ukuran penuh celahnya jelas; pada 16px
     celah seukuran aslinya menutup sendiri dan ketiga bidang melebur menjadi satu.

  Latar terang dipakai, bukan transparan: tab peramban bertema gelap akan
  menenggelamkan hijau lambang bila latarnya tembus pandang.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#f7f5ef" />
  <path d="M17.4 6 L26 16.9 L17.4 12.2 Z" fill="#eeb111" />
  <path d="M11.2 8.4 L25.4 20.2 L11.2 13.6 Z" fill="#d9822b" />
  <path d="M6.6 15.4 L25.4 23.6 L6.6 23.6 Z" fill="#4a6741" />
</svg>
