# Deployment YTS Hub — 10-DEVELOPMENT-PLAN.md §1.
#
# Situs ini di-build statis: seluruh query database berjalan saat build, dan yang
# dikirim ke pengunjung hanya HTML + CSS (09-ACCESSIBILITY-PERFORMANCE-SEO.md §5).
# Konsekuensinya: build butuh DATABASE_URL, dan konten baru terbit setelah rebuild.
#
# Set DATABASE_URL di Netlify → Site settings → Environment variables.
# JANGAN menulis connection string di file ini — file ini ikut ter-commit.

[build]
  base = "yts-hub-web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Aset ber-hash aman di-cache selamanya.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
